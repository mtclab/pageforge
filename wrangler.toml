name = "pageforge"
main = "src/worker/index.ts"
compatibility_date = "2026-07-01"
workers_dev = true
routes = [
  { pattern = "pageforge.mtclab.net", custom_domain = true },
]

[vars]
PUBLISH_ENABLED = "false"

[assets]
directory = "dist"
binding = "ASSETS"
# Every request runs the worker first so static assets get the same security
# headers as /api/* and /s/* (src/worker/security.ts, #52).
run_worker_first = true
# Unknown paths serve dist/404.html with status 404 instead of an empty body.
not_found_handling = "404-page"

[[kv_namespaces]]
binding = "SITES"
id = "b00a7b60e9db4f33848a53acb6499420"
